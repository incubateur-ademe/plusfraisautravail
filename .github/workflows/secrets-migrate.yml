name: 🔑 Secrets to Secret Manager

# One-off, to delete once run: copies the application secrets from the GitHub
# secrets to Scaleway Secret Manager, one secret per value, named
# pfat-prod-<name>. GitHub never gives a secret back, so only a workflow can
# move them. Run it by hand from main: the tofu-apply environment holds some
# of them. The Scaleway key needs SecretManagerFullAccess for this run.
# A secret that already holds the same value is left alone.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    name: 🔑 Copy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: tofu-apply
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      VALUE_VIGILANCE_APP_ID: ${{ secrets.VIGILANCE_APP_ID }}
      VALUE_RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
      VALUE_RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
      VALUE_CLIMADIAG_API_TOKEN: ${{ secrets.CLIMADIAG_API_TOKEN }}
      VALUE_NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      # Production sends its mail with the bucket key when no dedicated one is set.
      VALUE_EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD || secrets.S3_BUCKET_SCW_SECRET_KEY }}
      VALUE_CMS_MEDIA_ACCESS_KEY_ID: ${{ secrets.S3_BUCKET_SCW_ACCESS_KEY_ID }}
      VALUE_CMS_MEDIA_SECRET_KEY: ${{ secrets.S3_BUCKET_SCW_SECRET_KEY }}
      VALUE_E2E_FIXTURES_ACCESS_KEY_ID: ${{ secrets.S3_BUCKET_SCW_ACCESS_KEY_ID }}
      VALUE_E2E_FIXTURES_SECRET_KEY: ${{ secrets.S3_BUCKET_SCW_SECRET_KEY }}
    steps:
      - name: Copy the ten secrets
        run: |
          set -euo pipefail
          api="https://api.scaleway.com/secret-manager/v1beta1/regions/fr-par"
          auth="X-Auth-Token: $SCW_SECRET_KEY"
          names="vigilance-app-id rte-client-id rte-client-secret climadiag-api-token notion-token email-host-password cms-media-access-key-id cms-media-secret-key e2e-fixtures-access-key-id e2e-fixtures-secret-key"
          value() { local var="VALUE_$(tr 'a-z-' 'A-Z_' <<< "$1")"; printf '%s' "${!var}"; }

          # Nothing is written if a value production relies on is missing here.
          for name in $names; do
            [ -n "$(value "$name")" ] || { echo "::error::No GitHub secret for $name"; exit 1; }
          done

          for name in $names; do
            secret="pfat-prod-$name"
            current=$(curl -sS -H "$auth" "$api/secrets-by-path/versions/latest_enabled/access?project_id=$SCW_DEFAULT_PROJECT_ID&secret_path=/&secret_name=$secret" | jq -r '.data // empty | @base64d')
            if [ "$current" = "$(value "$name")" ]; then
              echo "same    $secret"
              continue
            fi
            id=$(curl -fsS -H "$auth" "$api/secrets?project_id=$SCW_DEFAULT_PROJECT_ID&name=$secret" | jq -r --arg n "$secret" '[.secrets[] | select(.name == $n)][0].id // empty')
            [ -n "$id" ] || id=$(jq -n --arg n "$secret" --arg p "$SCW_DEFAULT_PROJECT_ID" '{name: $n, project_id: $p}' |
              curl -fsS -H "$auth" -H "Content-Type: application/json" -d @- "$api/secrets" | jq -er .id)
            # With a final newline, like `just secrets-push`: the stack trims it.
            jq -n --arg d "$(printf '%s\n' "$(value "$name")" | base64 -w0)" '{data: $d, disable_previous: true}' |
              curl -fsS -H "$auth" -H "Content-Type: application/json" -d @- "$api/secrets/$id/versions" > /dev/null
            echo "pushed  $secret"
          done
