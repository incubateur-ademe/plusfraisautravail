name: Deploy CMS

on:
  push:
    branches:
      - main
    paths:
      - "apps/cms/**"
      - ".github/workflows/deploy-cms.yml"
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud
  REGISTRY_NAMESPACE: pfat
  IMAGE_NAME: cms
  REGION: fr-par

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres, not sqlite: sites_conformes ships at least one migration with
    # Postgres-only raw SQL (UPDATE ... FROM ... JOIN), which sqlite can't
    # parse. Matches what dev/prod actually run, so a migration or query that
    # only works on one engine gets caught here instead of at deploy time.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"
      - run: uv python install 3.12
      - working-directory: apps/cms
        run: uv sync --extra dev
      - working-directory: apps/cms
        run: uv run ruff check .
      - working-directory: apps/cms
        env:
          DJANGO_SECRET_KEY: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          ALLOWED_HOSTS: '["testserver","localhost"]'
        run: uv run pytest

  build-push:
    needs: test
    runs-on: ubuntu-latest
    environment: cms
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Compute image reference
        id: meta
        run: |
          IMAGE="$REGISTRY/$REGISTRY_NAMESPACE/$IMAGE_NAME:sha-${GITHUB_SHA::12}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: apps/cms
          push: true
          # Scaleway Serverless Containers only run amd64.
          platforms: linux/amd64
          build-args: |
            BUILD_SHA=sha-${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: cms
      url: ${{ vars.CMS_URL }}
    steps:
      - name: Trigger Scaleway container redeploy
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          CONTAINER_ID: ${{ vars.SCW_CMS_CONTAINER_ID }}
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          # Tofu's `output cms_container_id` is "fr-par/<uuid>"; the Scaleway REST API
          # expects just the UUID. Strip any leading "<region>/" defensively.
          CONTAINER_ID="${CONTAINER_ID##*/}"
          curl --fail-with-body -X PATCH \
            "https://api.scaleway.com/containers/v1/regions/$REGION/containers/$CONTAINER_ID" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"$IMAGE\", \"redeploy\": true}"

      - name: Run cms_manage job (migrations, image renditions, cache-control)
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          JOB_DEFINITION_ID: ${{ vars.SCW_CMS_MANAGE_JOB_ID }}
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          if [ -z "$JOB_DEFINITION_ID" ]; then
            echo "SCW_CMS_MANAGE_JOB_ID is not set - skipping (run 'just bootstrap-environments' to set it)."
            exit 0
          fi
          JOB_DEFINITION_ID="${JOB_DEFINITION_ID##*/}"
          # Unlike module.cms's container, tofu never re-applies this job
          # definition from CI (deploy-cms.yml only PATCHes the container, it
          # doesn't run tofu apply) - its image_uri would otherwise stay pinned
          # to whatever cms_image was set at the last manual `tofu apply`. PATCH
          # it to the image we just built and pushed before starting a run, so
          # migrate always runs against the code that's actually being deployed.
          curl --fail-with-body -X PATCH \
            "https://api.scaleway.com/serverless-jobs/v1alpha1/regions/$REGION/job-definitions/$JOB_DEFINITION_ID" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"image_uri\": \"$IMAGE\"}"
          # manage_jobs.sh (baked into the image) currently leads with
          # `manage.py migrate --noinput`.
          curl --fail-with-body -X POST \
            "https://api.scaleway.com/serverless-jobs/v1alpha1/regions/$REGION/job-definitions/$JOB_DEFINITION_ID/start" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{}"
