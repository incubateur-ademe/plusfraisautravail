name: OpenTofu apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:
    inputs:
      tofu_replace:
        description: "Resource address to force-replace (tofu apply -replace=<address>), e.g. module.cms_db.random_password.db. Leave empty for a normal apply."
        required: false
        type: string

env:
  TOFU_VERSION: "1.8.5"

# Don't run two applies in parallel — Tofu's state lock would just block
# the second one anyway, and serializing makes the deployment history clearer.
concurrency:
  group: tofu-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: tofu-apply
      url: ${{ vars.API_URL }}
    defaults:
      run:
        working-directory: infra/envs/prod
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      TF_VAR_vigilance_app_id: ${{ secrets.VIGILANCE_APP_ID }}
      TF_VAR_rte_client_id: ${{ secrets.RTE_CLIENT_ID }}
      TF_VAR_rte_client_secret: ${{ secrets.RTE_CLIENT_SECRET }}
      TF_VAR_climadiag_api_token: ${{ secrets.CLIMADIAG_API_TOKEN }}
      TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
      # Dedicated S3 credentials for cms's media access (private pfat-cms-media
      # bucket) - separate from the account-wide SCW_ACCESS_KEY/SCW_SECRET_KEY.
      TF_VAR_s3_bucket_scw_access_key_id: ${{ secrets.S3_BUCKET_SCW_ACCESS_KEY_ID }}
      TF_VAR_s3_bucket_scw_secret_key: ${{ secrets.S3_BUCKET_SCW_SECRET_KEY }}
      # Pin the image to whatever's currently deployed via the lifecycle ignore.
      # api_deploy/cms_deploy must be true here; the bootstrap (*_deploy=false)
      # flow is a one-time local thing.
      TF_VAR_api_deploy: "true"
      TF_VAR_cms_deploy: "true"
      TF_VAR_api_image: "rg.fr-par.scw.cloud/pfat/api:latest"
      TF_VAR_cms_image: "rg.fr-par.scw.cloud/pfat/cms:latest"
      # TODO: ALLOWED_HOSTS is wide open ("*") - confirmed root cause of the
      # cms-prod container never passing its Scaleway health check: the
      # platform's internal probe traffic doesn't reliably present the
      # container's own domain as the Host header, so Django's ALLOWED_HOSTS
      # check was 400-ing every single probe request (silently - no view is
      # ever reached, so nothing shows in app logs). qfdmo's preview
      # containers use the same "*" workaround for the same reason.
      # This is broader than ideal for a production app - narrow it once a
      # real fix is known, e.g.:
      #   - ask Scaleway support what Host header their probe actually sends
      #     and allowlist that specific value alongside the real domain
      #   - or move health-checking behind a lightweight proxy (like qfdmo's
      #     nginx layer) that doesn't enforce Host validation, keeping
      #     Django's own ALLOWED_HOSTS strict for real traffic
      TF_VAR_cms_extra_allowed_hosts: '["*"]'
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        env:
          TOFU_REPLACE: ${{ inputs.tofu_replace }}
        run: |
          replace_flag=()
          if [ -n "$TOFU_REPLACE" ]; then
            replace_flag=(-replace="$TOFU_REPLACE")
          fi
          tofu plan -no-color -input=false "${replace_flag[@]}" -out=tfplan | tee plan.txt
          {
            echo '## OpenTofu plan'
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: tofu apply
        run: tofu apply -input=false -no-color tfplan
