name: 🏗️ Infrastructure

# OpenTofu, infra/envs/prod. The plan always runs; `apply` applies it. A manual
# run applies by default, and can force the replacement of one resource.
on:
  workflow_call:
    inputs:
      apply:
        description: "Apply the plan"
        type: boolean
        default: false
      tofu_replace:
        description: "Resource address to force-replace"
        type: string
        default: ""
    outputs:
      plan:
        description: "What the plan would do, in one line"
        value: ${{ jobs.plan.outputs.plan }}
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan"
        type: boolean
        default: true
      tofu_replace:
        description: "Resource address to force-replace (tofu apply -replace=<address>), e.g. module.cms_db.random_password.db. Leave empty for a normal apply."
        required: false
        type: string

permissions:
  contents: read

# The plan of a pull request and the apply read the same things: the Scaleway
# key (repository secrets) and three repository variables. Every other secret
# is in Scaleway Secret Manager, read by tofu (DEPLOY.md).
env:
  TOFU_VERSION: "1.13.2"
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  # The S3 state backend.
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
  # Empty = https://<production domain>. Set the CMS_BASE_URL repository variable
  # to the Scalingo proxy URL while testing before the DNS cutover, unset after.
  TF_VAR_cms_base_url: ${{ vars.CMS_BASE_URL }}
  TF_VAR_posthog_key: ${{ vars.POSTHOG_KEY }}
  TF_VAR_sentry_dsn: ${{ vars.SENTRY_DSN }}

defaults:
  run:
    working-directory: infra/envs/prod

jobs:
  plan:
    name: 📋 Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      plan: ${{ steps.plan.outputs.summary }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - run: tofu fmt -check -recursive
        working-directory: infra

      - run: tofu init -input=false

      - run: tofu validate

      - name: tofu plan
        id: plan
        env:
          TOFU_REPLACE: ${{ inputs.tofu_replace }}
        run: |
          set -o pipefail
          status=0
          # Read-only: without the state lock, so it never makes an apply wait or fail.
          tofu plan -no-color -input=false -lock=false ${TOFU_REPLACE:+-replace="$TOFU_REPLACE"} 2>&1 | tee plan.txt || status=$?
          # A plan that only changes outputs prints neither "Plan:" nor "No changes".
          summary=$(grep -m1 -E '^(Plan:|No changes)' plan.txt) ||
            summary=$(grep -m1 '^Changes to Outputs' plan.txt | sed 's/:$/ only./') ||
            summary="Plan failed."
          [ "$status" = 0 ] || summary="Plan failed."
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          # A failed plan shows on the summary page too.
          {
            echo "## 🏗️ OpenTofu plan: $summary"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  apply:
    name: 🧱 Apply
    if: ${{ inputs.apply }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: tofu-apply
    # Never two applies at once: the state lock would refuse the second.
    concurrency:
      group: tofu-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - run: tofu init -input=false

      # Not the plan file of the job above: it holds the secret values, and the
      # artifacts of a public repository can be downloaded by anyone.
      - name: tofu apply
        env:
          TOFU_REPLACE: ${{ inputs.tofu_replace }}
        run: tofu apply -input=false -no-color -auto-approve ${TOFU_REPLACE:+-replace="$TOFU_REPLACE"}
