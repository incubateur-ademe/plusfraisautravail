name: 🎭 E2E

# Playwright, on pull requests labelled `frontend` and on main:
# - cms: the CMS restored from the nightly anonymised prod dump (e2e/restore.sh);
# - spa: every Storybook story of the SPAs (render, axe, screenshots) and
#   the autodiag journeys on its build.
# Not a product of .github/ci-areas.yml: it runs on a label, not on the files
# touched, and adding `labeled` to review.yml would rerun the whole CI on any label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.x"
  PYTHON_VERSION: "3.12"

jobs:
  cms:
    name: 🎭 CMS on the prod copy
    # Adding another label must not rerun the suite. Fork PRs get no secrets,
    # hence no dump: skipped.
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'frontend') &&
        (github.event.action != 'labeled' || github.event.label.name == 'frontend') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    # Per job, not per workflow: a skipped run (another label added) must not
    # cancel the one in progress. A job's `if` is evaluated before its group.
    concurrency:
      group: e2e-cms-${{ github.ref }}
      cancel-in-progress: true
    # Not ubuntu-latest: this image ships the PostgreSQL 16 client, the version
    # of the database service and of production (restore.sh needs it).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: pfat_e2e # restore.sh only empties a database named *e2e*
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: "postgresql://cms:cms@localhost:5432/pfat_e2e"
      E2E_COVERAGE: "1" # the CMS runs under coverage.py
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: npm ci
      - working-directory: apps/cms
        run: uv sync --extra dev
      # compilemessages needs msgfmt.
      - run: command -v msgfmt || (sudo apt-get update -q && sudo apt-get install -yq gettext)

      - name: Restore the anonymised prod dump, then migrate
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: ./e2e/restore.sh

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - run: npm run test:e2e

      # Separate from the unit-test coverage (cms.yml): what the e2e tests
      # exercise on the server, informative only.
      - name: Server coverage of the e2e tests
        if: ${{ !cancelled() }}
        working-directory: apps/cms
        run: |
          data=../../e2e/.cache/coverage/server.coverage
          [ -f "$data" ] || exit 0
          echo "### Couverture serveur des tests e2e" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --data-file="$data" --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/.cache/report
            e2e/.cache/test-results
          retention-days: 7

  spa:
    name: 🎭 SPA stories
    if: >-
      github.event_name != 'pull_request' || (
        contains(github.event.pull_request.labels.*.name, 'frontend') &&
        (github.event.action != 'labeled' || github.event.label.name == 'frontend')
      )
    concurrency:
      group: e2e-spa-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as `just e2e-spa-update-snapshots`, which made the reference
    # screenshots: same fonts, same rendering. Keep its tag equal to the
    # @playwright/test version (Renovate bumps both in one PR).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      HOME: /root # Firefox/Chromium refuse a HOME owned by another user
      E2E_COVERAGE: "1" # sourcemaps in the builds, browser coverage (e2e/coverage.ts)
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci
      - run: npm run test:spa # builds the Storybooks and autodiag first (pretest:spa)

      - name: Browser coverage of the e2e tests
        if: ${{ !cancelled() }}
        run: |
          summary=e2e/.cache/coverage/front/coverage-summary.md
          [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-spa-report
          path: |
            e2e/.cache/spa-report
            e2e/.cache/spa-results
          retention-days: 7
