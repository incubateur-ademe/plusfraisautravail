# Shared ruff config for every Python project in the repo (apps/cms, packages/*).
line-length = 100
target-version = "py312"
# sources/ holds one-off exploration scripts and notebooks, not shipped code.
extend-exclude = ["**/migrations/*.py", "sources"]
# First-party roots, so isort groups our own modules the same way from any directory.
src = ["apps/cms", "packages/*"]

[lint]
select = ["E", "F", "I", "B", "UP", "N"]
