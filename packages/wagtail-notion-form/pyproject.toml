[project]
name = "wagtail-notion-form"
version = "0.1.0"
description = "Sync a sites-conformes contact FormPage's submissions into a Notion database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wagtail_notion_form"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
