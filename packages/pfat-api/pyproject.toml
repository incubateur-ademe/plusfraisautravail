[project]
name = "pfat-api"
version = "0.1.0"
description = "Alert sources (Météo-France, RTE, Climadiag) for plusfraisautravail.beta.gouv.fr, as a Django Ninja API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-ninja>=1.3",
    "pydantic>=2.9",
    "httpx>=0.28",
    "meteole>=0.2.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfat_api"]
