[project]
name = "wagtail-admin-treebeard"
version = "0.1.0"
description = "Manage a django-treebeard tree as a Wagtail snippet: the standard listing in tree order with drag and drop, and treebeard's move fields in the edit form."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=7.0",
    "django-treebeard>=5.0",
]

[project.optional-dependencies]
dev = [
    "beautifulsoup4>=4.12",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wagtail_admin_treebeard"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
