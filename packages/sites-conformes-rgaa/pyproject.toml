[project]
name = "sites-conformes-rgaa"
version = "0.1.0"
description = "RGAA accessibility helpers for sites-conformes: wrap decorative emoji so screen readers skip them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=6.0",
    "sites-conformes>=4.0",
    "beautifulsoup4>=4.12",
    "emoji>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sites_conformes_rgaa"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
