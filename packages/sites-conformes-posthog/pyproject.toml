[project]
name = "sites-conformes-posthog"
version = "0.1.0"
description = "Identify authenticated CMS users to PostHog so team activity can be excluded from insights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "sites-conformes>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sites_conformes_posthog"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
