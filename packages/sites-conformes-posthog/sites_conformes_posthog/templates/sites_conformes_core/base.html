{% extends "sites_conformes_core/base.html" %}

{% block body_tracking_scripts %}
  {{ block.super }}
  {% if request.user.is_authenticated %}
    <script>
      if (window.posthog) {
        posthog.identify("{{ request.user.username|escapejs }}", {
          email: "{{ request.user.email|escapejs }}",
          admin: {{ request.user.is_superuser|yesno:"true,false" }}
        });
      }
    </script>
  {% endif %}
{% endblock body_tracking_scripts %}
