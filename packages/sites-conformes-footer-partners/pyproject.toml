[project]
name = "sites-conformes-footer-partners"
version = "0.1.0"
description = "Sitewide DSFR footer partner logos (fr-footer__partners) for sites-conformes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=6.0",
    "sites-conformes>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sites_conformes_footer_partners"]
