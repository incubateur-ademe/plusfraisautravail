[project]
name = "sites-conformes-cms"
version = "0.1.0"
description = "Sites-conformes Django CMS for plusfraisautravail.beta.gouv.fr."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sites-conformes>=4.0",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "django-storages[s3]>=1.14",
    "whitenoise>=6.8",
    "python-dotenv>=1.0",
    "django-debug-toolbar>=6.1",
    "wagtail-notion-form",
    "sites-conformes-footer-partners",
    "sites-conformes-header-logo",
    "sites-conformes-posthog",
    "sites-conformes-rgaa",
    "sites-conformes-faq",
]

[tool.uv.sources]
# numerique-gouv/sites-conformes branch abstract-blog-model (swappable page models,
# on top of #606), pinned to its head commit. Source archive rather than a git
# source: the CMS image has no git.
sites-conformes = { url = "https://github.com/numerique-gouv/sites-conformes/archive/510e81e34824321d1376b42d498b1a4328c78d0d.tar.gz" }
wagtail-notion-form = { path = "../../packages/wagtail-notion-form", editable = true }
sites-conformes-footer-partners = { path = "../../packages/sites-conformes-footer-partners", editable = true }
sites-conformes-header-logo = { path = "../../packages/sites-conformes-header-logo", editable = true }
sites-conformes-posthog = { path = "../../packages/sites-conformes-posthog", editable = true }
sites-conformes-rgaa = { path = "../../packages/sites-conformes-rgaa", editable = true }
sites-conformes-faq = { path = "../../packages/sites-conformes-faq", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cms"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cms.settings.production"
testpaths = ["tests"]
