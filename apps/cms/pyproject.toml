[project]
name = "sites-conformes-cms"
version = "0.1.0"
description = "Sites-conformes Django CMS for plusfraisautravail.beta.gouv.fr."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sites-conformes>=4.0",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "django-storages[s3]>=1.14",
    "whitenoise>=6.8",
    "python-dotenv>=1.0",
    "sentry-sdk[django]>=2.35",
    "django-debug-toolbar>=6.1",
    "wagtail-notion-form",
    "sites-conformes-footer-partners",
    "sites-conformes-header-logo",
    "sites-conformes-posthog",
    "sites-conformes-rgaa",
    "sites-conformes-faq",
    "wagtail-in-a-tree>=0.1.0",
    "pfat-api",
]

[tool.uv.sources]
# numerique-gouv/sites-conformes#630 (swappable BlogEntryPage, on top of the
# categories stack #598→#629 and #606), pinned to its head commit. Source archive
# rather than a git source: the CMS image has no git.
sites-conformes = { url = "https://github.com/numerique-gouv/sites-conformes/archive/c1d2446e0b14b511906ecaff36a40d47c45da9a4.tar.gz" }
wagtail-notion-form = { path = "../../packages/wagtail-notion-form", editable = true }
sites-conformes-footer-partners = { path = "../../packages/sites-conformes-footer-partners", editable = true }
sites-conformes-header-logo = { path = "../../packages/sites-conformes-header-logo", editable = true }
sites-conformes-posthog = { path = "../../packages/sites-conformes-posthog", editable = true }
sites-conformes-rgaa = { path = "../../packages/sites-conformes-rgaa", editable = true }
sites-conformes-faq = { path = "../../packages/sites-conformes-faq", editable = true }
pfat-api = { path = "../../packages/pfat-api", editable = true }

[tool.uv]
# sites-conformes caps wagtail<8 only because wagtail-2fa 1.8.0 imports the removed
# UserListingButton (labd/wagtail-2fa#288). Harmless here: neither wagtail_2fa nor
# sites_conformes.dashboard (its only importer) is in INSTALLED_APPS, so it never loads.
# Drop this once sites-conformes lifts the cap. Adding either app before then needs a
# wagtail-2fa release with that fix.
override-dependencies = ["wagtail>=8.1,<8.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cms"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cms.settings.production"
testpaths = ["tests"]
